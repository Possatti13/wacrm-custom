name: Ciclopes GHCR private bootstrap

# Only this dedicated bootstrap ref can run this temporary workflow.
# The production image workflow listens to a different ref.
on:
  push:
    branches: [codex/run-ghcr-bootstrap-private]

permissions:
  contents: read
  packages: write

concurrency:
  group: ciclopes-ghcr-bootstrap-private
  cancel-in-progress: false

jobs:
  bootstrap-private:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: no application source or production configuration reaches this job.
      - name: Publish empty OCI artifact and require private visibility
        env:
          GHCR_BOOTSTRAP_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError('Unexpected registry redirect')

          opener = urllib.request.build_opener(NoRedirect)
          package_api = 'https://api.github.com/users/Possatti13/packages/container/ciclopes'
          registry = 'https://ghcr.io/v2/possatti13/ciclopes'
          tag = 'bootstrap-private'
          token = os.environ['GHCR_BOOTSTRAP_TOKEN']
          api_headers = {
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          stage = 'initial_package_check'

          def request(url, method='GET', headers=None, body=None):
              try:
                  req = urllib.request.Request(url, data=body, headers=headers or {}, method=method)
                  with opener.open(req, timeout=30) as response:
                      return response.status, response.headers, response.read()
              except urllib.error.HTTPError as error:
                  # Status and fixed registry error codes only; never print body/message/URL.
                  print(json.dumps({'operation': stage, 'method': method, 'httpStatus': error.code}))
                  return error.code, error.headers, error.read()

          def require_private():
              status, _, body = request(package_api, headers=api_headers)
              if status != 200 or json.loads(body).get('visibility') != 'private':
                  raise RuntimeError('Private package verification failed')

          def pack(value):
              return json.dumps(value, separators=(',', ':'), sort_keys=True).encode()

          try:
              status, _, body = request(package_api, headers=api_headers)
              if status not in (200, 404):
                  raise RuntimeError('Package preflight failed')
              if status == 200 and json.loads(body).get('visibility') != 'private':
                  raise RuntimeError('Existing package is not private')

              stage = 'ephemeral_registry_authentication'
              basic = base64.b64encode((os.environ['GITHUB_ACTOR'] + ':' + token).encode()).decode()
              status, _, body = request(
                  'https://ghcr.io/token?service=ghcr.io&scope=repository%3Apossatti13%2Fciclopes%3Apull%2Cpush',
                  headers={'Authorization': 'Basic ' + basic},
              )
              if status != 200:
                  raise RuntimeError('GITHUB_TOKEN cannot publish to GHCR')
              auth = {'Authorization': 'Bearer ' + json.loads(body)['token']}

              config = pack({
                  'architecture': 'amd64',
                  'os': 'linux',
                  'config': {},
                  'rootfs': {'type': 'layers', 'diff_ids': []},
                  'history': [],
              })
              config_digest = 'sha256:' + hashlib.sha256(config).hexdigest()
              manifest = pack({
                  'schemaVersion': 2,
                  'mediaType': 'application/vnd.oci.image.manifest.v1+json',
                  'config': {
                      'mediaType': 'application/vnd.oci.image.config.v1+json',
                      'digest': config_digest,
                      'size': len(config),
                  },
                  'layers': [],
              })
              manifest_digest = 'sha256:' + hashlib.sha256(manifest).hexdigest()
              manifest_headers = dict(auth, Accept='application/vnd.oci.image.manifest.v1+json')
              status, _, existing = request(registry + '/manifests/' + tag, headers=manifest_headers)
              if status == 200 and hashlib.sha256(existing).hexdigest() != manifest_digest[7:]:
                  raise RuntimeError('Refusing to overwrite different bootstrap artifact')
              if status not in (200, 404):
                  raise RuntimeError('Bootstrap tag preflight failed')

              stage = 'empty_config_upload'
              status, headers, _ = request(registry + '/blobs/uploads/', 'POST', auth, b'')
              if status != 202:
                  raise RuntimeError('Blob upload initialization failed')
              location = urllib.parse.urljoin(registry + '/', headers['Location'])
              parsed = urllib.parse.urlsplit(location)
              if parsed.scheme != 'https' or parsed.netloc != 'ghcr.io' or not parsed.path.startswith('/v2/possatti13/ciclopes/blobs/uploads/'):
                  raise RuntimeError('Unexpected blob upload destination')
              query = urllib.parse.parse_qsl(parsed.query, keep_blank_values=True)
              query.append(('digest', config_digest))
              location = urllib.parse.urlunsplit(parsed._replace(query=urllib.parse.urlencode(query)))
              status, _, _ = request(location, 'PUT', dict(auth, **{'Content-Type': 'application/octet-stream'}), config)
              if status != 201:
                  raise RuntimeError('Empty config upload failed')

              stage = 'bootstrap_manifest_publication'
              publish_headers = dict(auth, **{'Content-Type': 'application/vnd.oci.image.manifest.v1+json'})
              status, headers, _ = request(registry + '/manifests/' + tag, 'PUT', publish_headers, manifest)
              if status != 201 or headers.get('Docker-Content-Digest') != manifest_digest:
                  raise RuntimeError('Bootstrap publication failed')

              # First operation after publication: fail closed if GitHub reports anything except private.
              stage = 'immediate_private_visibility_check'
              require_private()

              # Re-publish identical bytes only, proving the ephemeral token still has publication access.
              stage = 'retained_publication_permission_check'
              status, headers, _ = request(registry + '/manifests/' + tag, 'PUT', publish_headers, manifest)
              if status != 201 or headers.get('Docker-Content-Digest') != manifest_digest:
                  raise RuntimeError('Publication access was not retained')
              require_private()

              evidence = {
                  'package': 'ghcr.io/possatti13/ciclopes',
                  'tag': tag,
                  'digest': manifest_digest,
                  'visibility': 'private',
                  'layerCount': 0,
                  'applicationSourceCheckedOut': False,
                  'applicationBuildExecuted': False,
                  'runtimeSecretsSupplied': False,
                  'publisher': 'ephemeral GITHUB_TOKEN only',
                  'publicationAccessRetained': True,
                  'bootstrapTagRetainedForReadValidation': True,
              }
              print(json.dumps(evidence, indent=2))
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('## GHCR bootstrap PASS\n\n```json\n' + json.dumps(evidence, indent=2) + '\n```\n')
          except Exception as error:
              # Never log response bodies, auth headers, upload URLs, tokens or exception messages.
              safe_reasons = {
                  'Package preflight failed', 'Existing package is not private',
                  'GITHUB_TOKEN cannot publish to GHCR', 'Refusing to overwrite different bootstrap artifact',
                  'Bootstrap tag preflight failed', 'Blob upload initialization failed',
                  'Unexpected blob upload destination', 'Empty config upload failed',
                  'Bootstrap publication failed', 'Private package verification failed',
                  'Publication access was not retained', 'Unexpected registry redirect',
              }
              reason = str(error) if str(error) in safe_reasons else type(error).__name__
              print(json.dumps({'bootstrap': 'FAIL', 'stage': stage, 'httpStatus': status, 'safeReason': reason, 'credentialsLogged': False}), file=sys.stderr)
              sys.exit(1)
          PY
